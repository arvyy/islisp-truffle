name: Build ISLISP site
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_site.yml'
      - 'docs-site/**'
jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: 'Build docs'
        run: |
          cd docs-site/antora-truffle-ui
          npm i
          npx gulp build
          npx gulp bundle:pack
          cd ../
          npm i
          npx antora antora-playbook.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs-site/build/site'
  deploy_site:
    needs: [build_site]
    if: ${{ startsWith(github.ref, 'refs/heads/master') }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
